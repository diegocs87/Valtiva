# Robolectric runs the Room DAO tests on the JVM.
#
# It defaults to the project's targetSdk (36), but the Android 36 runtime requires Java 21 while
# this project is pinned to the Java 17 toolchain. SDK 35 is the newest runtime that works on
# Java 17, and it is well above minSdk 26. These tests exercise SQLite and Room, not platform APIs
# introduced in 36, so the older sandbox costs nothing.
#
# Revisit if the project ever moves to a Java 21 toolchain.
sdk=35

# Android resources are deliberately NOT loaded into the sandbox
# (no `testOptions.unitTests.isIncludeAndroidResources`). These tests exercise Room and SQLite and
# never read a resource, and enabling resource loading pulls the whole resource machinery
# (ResourcesImpl, ComplexColor, ...) through Robolectric's bytecode instrumentation, which has been
# a source of intermittent VerifyError-style failures. Any future Robolectric test that genuinely
# needs resources should turn it on for that test rather than for the whole module.
