# Detekt configuration for Valtiva.
# Builds on top of detekt's default rule set (buildUponDefaultConfig = true);
# only deviations from the defaults are declared here.

build:
  maxIssues: 0

naming:
  FunctionNaming:
    # Composable functions use PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    # Allow literals in property declarations (e.g. Compose Color values).
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable', 'Preview']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
